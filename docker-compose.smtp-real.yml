# Ative junto ao docker-compose.yml somente para validar entrega em uma caixa real.
# Os valores SMTP vêm do .env e são obrigatórios para evitar iniciar com placeholders.
services:
  notificationsapi:
    environment:
      Smtp__Host: ${SMTP_HOST:?Configure SMTP_HOST no .env}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:?Configure SMTP_USER no .env}
      Smtp__Password: ${SMTP_PASSWORD:?Configure SMTP_PASSWORD no .env}
      Smtp__From: ${SMTP_FROM:?Configure SMTP_FROM autorizado no .env}
      Smtp__SecureSocketOptions: ${SMTP_SECURE_SOCKET_OPTIONS:-StartTls}
