apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-api-config
  namespace: fcg-demo
data:
  Swagger__Enabled: "false"
  Smtp__Host: "smtp.gmail.com"
  Smtp__Port: "587"
  Smtp__From: "fcgproject.dev@gmail.com"
  Smtp__SecureSocketOptions: "StartTls"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg-demo
  labels:
    app: notifications-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
        - name: notifications-api
          image: fgcprojetofiap/notifications-api:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: fcg-config
            - configMapRef:
                name: notifications-api-config
          env:
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_PASSWORD
            - name: NOTIFICATIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: NOTIFICATIONS_DB_PASSWORD
            - name: ConnectionStrings__NotificationsDatabase
              value: "Host=postgres;Port=5432;Database=$(NOTIFICATIONS_DB_NAME);Username=$(NOTIFICATIONS_DB_USER);Password=$(NOTIFICATIONS_DB_PASSWORD);Include Error Detail=false"
            - name: Smtp__User
              valueFrom:
                secretKeyRef:
                  name: notifications-api-secrets
                  key: Smtp__User
            - name: Smtp__Password
              valueFrom:
                secretKeyRef:
                  name: notifications-api-secrets
                  key: Smtp__Password
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-api
  namespace: fcg-demo
  labels:
    app: notifications-api
spec:
  type: ClusterIP
  selector:
    app: notifications-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
