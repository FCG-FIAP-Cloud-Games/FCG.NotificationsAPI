name: fcg-notifications

x-notifications-config: &notifications-config
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"
  Swagger__Enabled: "true"
  Database__ApplyMigrationsOnStartup: "true"
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: /
  RabbitMq__Username: ${RABBITMQ_USER:-fcg_notifications_demo}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-Rabbit_Notif_Demo_2026!}
  RabbitMq__UseTls: "false"
  ConnectionStrings__NotificationsDatabase: "Host=postgres;Port=5432;Database=fcg_notifications;Username=${POSTGRES_USER:-fcg_notifications_demo};Password=${POSTGRES_PASSWORD:-NotifDb_Demo_2026!}"
  # Perfil padrão seguro: todas as mensagens ficam no MailHog local.
  Smtp__Host: smtp-dev
  Smtp__Port: "1025"
  Smtp__User: ""
  Smtp__Password: ""
  Smtp__From: no-reply@fcgnotifications.local
  Smtp__SecureSocketOptions: None

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fcg_notifications
      POSTGRES_USER: ${POSTGRES_USER:-fcg_notifications_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-NotifDb_Demo_2026!}
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d fcg_notifications"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - fcg-interna

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fcg_notifications_demo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-Rabbit_Notif_Demo_2026!}
    ports:
      - "127.0.0.1:5672:5672"
      - "${FCG_RABBIT_MANAGEMENT_BIND_ADDRESS:-127.0.0.1}:${FCG_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-dados:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks:
      - fcg-interna

  smtp-dev:
    image: mailhog/mailhog
    container_name: fcg_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks:
      - fcg-interna

  notificationsapi:
    build: .
    image: fgcprojetofiap/notifications-api:${NOTIFICATIONS_API_TAG:-1.0.4}
    restart: unless-stopped
    environment:
      <<: *notifications-config
    ports:
      - "127.0.0.1:${FCG_NOTIFICATIONS_HTTP_PORT:-5083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      smtp-dev:
        condition: service_started
    networks:
      - fcg-interna
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fcg-interna:
    driver: bridge

volumes:
  postgres-dados:
  rabbitmq-dados:
